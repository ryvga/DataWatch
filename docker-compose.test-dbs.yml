services:
  test-mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: datawatch_connector_test
      MYSQL_USER: datawatch
      MYSQL_PASSWORD: datawatch
      MYSQL_ROOT_PASSWORD: datawatch-root
    ports:
      - "3307:3306"
    volumes:
      - ./scripts/test_dbs/mysql_seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "datawatch", "-pdatawatch"]
      interval: 5s
      timeout: 5s
      retries: 20

  test-mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: datawatch_connector_test
      MARIADB_USER: datawatch
      MARIADB_PASSWORD: datawatch
      MARIADB_ROOT_PASSWORD: datawatch-root
    ports:
      - "3308:3306"
    volumes:
      - ./scripts/test_dbs/mysql_seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  test-mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: datawatch-root
      MONGO_INITDB_ROOT_PASSWORD: datawatch-root
    ports:
      - "27018:27017"
    volumes:
      - ./scripts/test_dbs/mongo_seed.js:/docker-entrypoint-initdb.d/seed.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "datawatch-root", "--password", "datawatch-root", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  test-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DataWatch-Test-2026!"
    ports:
      - "1434:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'DataWatch-Test-2026!' -C -Q 'SELECT 1' -b || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  test-cassandra:
    image: cassandra:5.0
    environment:
      CASSANDRA_CLUSTER_NAME: DataWatch Test Cluster
      CASSANDRA_NUM_TOKENS: 16
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    ports:
      - "9043:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT release_version FROM system.local' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 45s
