name: DataWatch CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: datawatch-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: datawatch
          POSTGRES_PASSWORD: datawatch
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U datawatch -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Lint backend
        working-directory: backend
        run: ruff check app tests
      - name: Type-check safe monitor core
        working-directory: backend
        run: mypy --ignore-missing-imports --follow-imports=skip app/services/monitor_dsl.py app/services/monitor_evaluator.py app/services/monitor_attestation.py app/services/schema_binding.py
      - name: Create isolated PostgreSQL test database
        env:
          PGPASSWORD: datawatch
        run: psql -h 127.0.0.1 -p 5433 -U datawatch -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE datawatch_test;'
      - name: Start connector matrix services
        run: docker compose -f docker-compose.test-dbs.yml up -d --wait test-mysql test-mariadb test-mongo
      - name: Run backend suite without silent integration skips
        env:
          DATABASE_URL: postgresql+asyncpg://datawatch:datawatch@127.0.0.1:5433/datawatch_test
          TEST_DATABASE_URL: postgresql+asyncpg://datawatch:datawatch@127.0.0.1:5433/datawatch_test
          REDIS_URL: redis://127.0.0.1:6379/1
          REQUIRE_TEST_SERVICES: '1'
          SECRET_KEY: ci-secret-key-xxxxxxxxxxxxxxxxxxxxxxxx
          FERNET_MASTER_KEY: dGVzdC1mZXJuZXQta2V5LXBhZGRlZC10by0zMmJ5dGVzISE=
          ENVIRONMENT: test
        run: python -m pytest -q backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  fullstack-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create deterministic CI environment
        run: |
          cp .env.example .env
          python - <<'PY'
          from pathlib import Path
          path = Path('.env')
          text = path.read_text()
          replacements = {
              'SECRET_KEY=': 'SECRET_KEY=ci-secret-key-xxxxxxxxxxxxxxxxxxxxxxxx',
              'FERNET_MASTER_KEY=': 'FERNET_MASTER_KEY=dGVzdC1mZXJuZXQta2V5LXBhZGRlZC10by0zMmJ5dGVzISE=',
              'OPENROUTER_API_KEY=': 'OPENROUTER_API_KEY=',
              'STAFF_PASSWORD=': 'STAFF_PASSWORD=admin1234',
          }
          for prefix, value in replacements.items():
              text = '\n'.join(value if line.startswith(prefix) else line for line in text.splitlines()) + '\n'
          path.write_text(text)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start seeded application stack
        run: |
          docker compose up -d --build --wait postgres redis mailhog acme-db analytics-db
          docker compose run --rm migrate
          docker compose up -d --build --wait api worker frontend
      - name: Seed deterministic demo workspaces
        run: docker compose --profile seed run --rm seed
      - name: Run seeded browser smoke suite
        working-directory: frontend
        run: npm run test:e2e
      - name: Tear down stack
        if: always()
        run: docker compose down -v --remove-orphans
