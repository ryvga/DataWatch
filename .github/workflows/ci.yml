name: DataWatch CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: datawatch-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: datawatch
          POSTGRES_PASSWORD: datawatch
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U datawatch -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Create isolated PostgreSQL test database
        env:
          PGPASSWORD: datawatch
        run: psql -h 127.0.0.1 -p 5433 -U datawatch -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE datawatch_test;'
      - name: Start connector matrix services
        run: docker compose -f docker-compose.test-dbs.yml up -d --wait test-mysql test-mariadb test-mongo
      - name: Run backend suite without silent integration skips
        env:
          DATABASE_URL: postgresql+asyncpg://datawatch:datawatch@127.0.0.1:5433/datawatch_test
          TEST_DATABASE_URL: postgresql+asyncpg://datawatch:datawatch@127.0.0.1:5433/datawatch_test
          REDIS_URL: redis://127.0.0.1:6379/1
          REQUIRE_TEST_SERVICES: '1'
          SECRET_KEY: ci-secret-key-xxxxxxxxxxxxxxxxxxxxxxxx
          FERNET_MASTER_KEY: dGVzdC1mZXJuZXQta2V5LXBhZGRlZC10by0zMmJ5dGVzISE=
          ENVIRONMENT: test
        run: python -m pytest -q backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
